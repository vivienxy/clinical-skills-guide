<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clinical Skills Pocket</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar with Exam | History switch; exam list rail on the left (drawer on phones); step cards in guide order. */
:root{
  --bg:#f5f7f7; --panel:#ffffff; --ink:#14222b; --muted:#5b6b73; --line:#dbe3e5; --soft:#eaf0f1;
  --accent:#0d6b62; --accent-ink:#ffffff; --accent-soft:#dcefeb; --mark:#fff3c8;
  --report:#f1f6fb; --report-line:#9fbdd6; --note-bg:#fffbea; --note-line:#e6d48a; --note-ink:#7a5a00;
  --p-vitals:#7a5c9e; --p-inspect:#0d6b62; --p-palpate:#b0601b; --p-percuss:#8a6a12; --p-auscultate:#2c5e9e; --p-special:#a33b4b; --p-other:#5b6b73;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-head:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --panel:#162124; --ink:#e3ecee; --muted:#93a6ab; --line:#2a3a3e; --soft:#1d2b2f;
  --accent:#4cc2b0; --accent-ink:#06211d; --accent-soft:#173a36; --mark:#4a3f12;
  --report:#172a38; --report-line:#3d6788; --note-bg:#25220f; --note-line:#6b5d22; --note-ink:#e8cf6a;
  --p-vitals:#b79be0; --p-inspect:#4cc2b0; --p-palpate:#e59a59; --p-percuss:#d6b44e; --p-auscultate:#7fb0ee; --p-special:#ec8494; --p-other:#93a6ab;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --panel:#162124; --ink:#e3ecee; --muted:#93a6ab; --line:#2a3a3e; --soft:#1d2b2f;
  --accent:#4cc2b0; --accent-ink:#06211d; --accent-soft:#173a36; --mark:#4a3f12;
  --report:#172a38; --report-line:#3d6788; --note-bg:#25220f; --note-line:#6b5d22; --note-ink:#e8cf6a;
  --p-vitals:#b79be0; --p-inspect:#4cc2b0; --p-palpate:#e59a59; --p-percuss:#d6b44e; --p-auscultate:#7fb0ee; --p-special:#ec8494; --p-other:#93a6ab;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
button,input{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font:600 17px/1 var(--f-head);letter-spacing:.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand svg{flex:none}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.search{flex:1;min-width:180px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px 8px 32px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);max-height:60vh;overflow:auto;z-index:40}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.results button:hover,.results button:focus{background:var(--soft)}
.results small{color:var(--muted);display:block;font-size:12px}
.menu-btn{display:none;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:500}

/* shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;max-width:1240px;margin:0 auto;padding-block:20px 80px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);align-self:start;max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
.rail h4{font:600 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 6px}
.rail h4:first-child{margin-top:0}
.rail a{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:7px;text-decoration:none;color:var(--ink)}
.rail a span{color:var(--muted);font:12px var(--f-mono)}
.rail a:hover{background:var(--soft)}
.rail a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
main{min-width:0}

/* exam header */
.eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font:600 30px/1.15 var(--f-head);margin:6px 0 10px;text-wrap:balance}
h2{font:600 20px/1.2 var(--f-head);margin:0;text-wrap:balance}
.order{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 14px}
.order a{font-size:13px;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.order a:hover{border-color:var(--accent)}
.order i{color:var(--muted);font-style:normal;font-size:12px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
.progress{font:12px var(--f-mono);color:var(--muted);margin-left:auto}
details.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin:0 0 12px}
details.box>summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
details.box[open]>summary::before{transform:rotate(45deg)}
details.box .inner{padding:0 14px 14px}

/* sections & steps */
.sec{margin:26px 0 10px;display:flex;align-items:baseline;gap:10px;scroll-margin-top:90px}
.sec .n{font:12px var(--f-mono);color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:8px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);scroll-margin-top:90px}
.step>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 12px}
.step>summary::-webkit-details-marker{display:none}
.step.done>summary .name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.num{font:500 12px var(--f-mono);color:var(--muted);min-width:22px;text-align:right}
.tick{width:18px;height:18px;accent-color:var(--accent);margin:0;cursor:pointer}
.name{font-weight:600;min-width:0}
.name .tags{display:inline-flex;gap:4px;margin-left:6px;vertical-align:2px}
.tag{font:500 10.5px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.04em;padding:3px 6px;border-radius:4px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.cond{background:var(--mark);color:var(--ink)}
.chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px;transition:transform .15s}
.step[open] .chev{transform:rotate(225deg)}
.ph{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--p-other)}
.ph.vitals{background:var(--p-vitals)}.ph.inspect{background:var(--p-inspect)}.ph.palpate{background:var(--p-palpate)}.ph.percuss{background:var(--p-percuss)}.ph.auscultate{background:var(--p-auscultate)}.ph.special,.ph.rom,.ph.power{background:var(--p-special)}
.body{padding:0 14px 14px 14px;border-top:1px solid var(--line);display:grid;gap:12px;padding-top:12px}
.lab{font:600 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 5px}
.body ul{margin:0;padding-left:0;list-style:none}
.body li{margin:3px 0;padding-left:14px;position:relative}
.body li::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--muted)}
.body li.sub{margin-left:16px}
.body li.sub::before{background:none;border:1px solid var(--muted)}
.body li.sub2{margin-left:32px}
.body li.sub2::before{border-radius:0;width:4px;height:4px}
.body li.plain::before{display:none}
.body li.plain{padding-left:0}
.body li.hd{font-weight:600;padding-left:0;margin-top:6px}
.body li.hd::before{display:none}
.report{background:var(--report);border-left:3px solid var(--report-line);border-radius:6px;padding:9px 12px}
.report p{margin:0}
.more{border:1px solid var(--line);border-radius:8px}
.more>summary{cursor:pointer;padding:7px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.more .in{padding:0 10px 10px;font-size:14px}
.figs{display:flex;flex-wrap:wrap;gap:8px}
.figs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px;cursor:zoom-in;max-width:100%}
.figs img{display:block;max-height:150px;max-width:100%;height:auto;width:auto}
.pg{font:12px var(--f-mono);color:var(--muted)}
.notes ul{margin:0;padding-left:18px}
.notes li{margin:3px 0}

/* reference cards */
.refs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;margin:0 0 12px}
.ref{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.ref h3{font:600 15px var(--f-head);margin:0 0 8px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.k{font-family:var(--f-mono);white-space:nowrap}
.ref svg{display:block;width:100%;height:auto;max-width:360px;margin:0 auto}
.ref svg text{fill:var(--ink);font:11px var(--f-body)}
.ref svg .small{font-size:9.5px;fill:var(--muted)}

/* history */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px;border-bottom:1px solid var(--line)}
.subtabs button{border:0;background:none;padding:9px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.hgrid{display:grid;gap:10px}
.hcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 14px}
.hcard .big{font:600 30px/1 var(--f-head);color:var(--accent)}
.hcard h3{font:600 16px var(--f-head);margin:2px 0 4px}
.q{margin:0;padding:0;list-style:none}
.q li{padding:3px 0 3px 18px;position:relative}
.q li::before{content:"“";position:absolute;left:2px;top:1px;color:var(--accent);font:600 18px/1 var(--f-head)}
.q li.n::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--muted);top:.65em;left:4px}
.tip{font-size:13.5px;color:var(--muted);margin:6px 0 0}
.ros{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:10px}
.ros .sys{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.ros h3{font:600 15px var(--f-head);margin:0 0 6px;display:flex;justify-content:space-between}
.ros label{display:flex;gap:8px;align-items:flex-start;padding:3px 0;cursor:pointer}
.ros label input{margin-top:4px;accent-color:var(--accent)}
.ros .hy{font-weight:600}
.ros .oth{color:var(--muted)}
.intro{background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;margin:0 0 14px}
.big6{display:grid;gap:10px}
.lead{max-width:68ch;color:var(--muted);margin:0 0 14px}

/* lightbox */
.note{background:var(--panel);border:1px solid var(--note-line);border-radius:var(--r);margin:0 0 14px}
.note>summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center}
.note>summary::-webkit-details-marker{display:none}
.note .inner{padding:0 14px 12px}
.fmt{display:flex;flex-wrap:wrap;align-items:center;gap:2px;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:var(--panel);padding:3px}
.fmt button{border:0;background:none;min-width:34px;height:32px;padding:0 6px;border-radius:6px;cursor:pointer;font-size:14px;line-height:1;color:var(--ink);display:inline-grid;place-items:center}
.fmt button:hover{background:var(--soft)}
.fmt button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.fmt .fs2{font-size:11px}.fmt .fs5{font-size:18px;font-weight:600}
.fmt .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
.rte{min-height:120px;border:1px solid var(--line);border-radius:0 0 8px 8px;background:var(--note-bg);color:var(--ink);padding:9px 11px;font:14px/1.5 var(--f-body);outline:none;overflow-wrap:anywhere;cursor:text}
.rte:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.snote .rte{min-height:70px}
.rte:empty::before{content:attr(data-ph);color:var(--muted);pointer-events:none}
.rte ul,.rte ol,.nview ul,.nview ol{list-style:disc!important;padding-left:22px!important;margin:4px 0!important}
.rte ol,.nview ol{list-style:decimal!important}
.rte ul ul,.nview ul ul{list-style:circle!important}
.rte li,.nview li{padding-left:0!important;margin:2px 0!important;position:static!important}
.rte li::before,.nview li::before{content:none!important}
.rte p,.nview p{margin:0}
.rte font[size="1"],.nview font[size="1"]{font-size:.75em}.rte font[size="2"],.nview font[size="2"]{font-size:.85em}.rte font[size="3"],.nview font[size="3"]{font-size:1em}
.rte font[size="4"],.nview font[size="4"]{font-size:1.15em}.rte font[size="5"],.nview font[size="5"]{font-size:1.3em}.rte font[size="6"],.nview font[size="6"]{font-size:1.5em}.rte font[size="7"],.nview font[size="7"]{font-size:1.8em}
.nview{font:14px/1.5 var(--f-body);margin:6px 0 0;overflow-wrap:anywhere}

/* highlighter */
mark.hl{color:inherit;border-radius:2px}
mark.hl[data-c="0"]{background:rgba(255,210,0,.5)}mark.hl[data-c="1"]{background:rgba(60,200,110,.4)}mark.hl[data-c="2"]{background:rgba(255,100,170,.38)}mark.hl[data-c="3"]{background:rgba(70,150,255,.38)}mark.hl[data-c="4"]{background:rgba(255,140,30,.45)}
.sw-0{background:#ffd400}.sw-1{background:#3cc86e}.sw-2{background:#ff64aa}.sw-3{background:#4696ff}.sw-4{background:#ff8c1e}
body.hl-erase mark.hl{cursor:pointer;outline:1px dashed currentColor;outline-offset:1px}
.hlfab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:35;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.hlbtn{width:50px;height:50px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);box-shadow:0 4px 16px rgba(0,0,0,.18);display:grid;place-items:center;cursor:pointer;position:relative}
.hlbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hlbtn .dot{position:absolute;right:3px;bottom:3px;width:14px;height:14px;border-radius:50%;border:2px solid var(--panel)}
.hlpanel{width:min(250px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:12px;display:grid;gap:10px}
.hlpanel .hd{font:600 14px var(--f-head);display:flex;justify-content:space-between;align-items:center}
.hlpanel .hd span{font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hlpanel .sw{display:flex;gap:8px;flex-wrap:wrap}
.hlpanel .sw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.hlpanel .sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.hlpanel .sw .er{background:var(--soft);display:grid;place-items:center;color:var(--ink)}
.hlpanel p{margin:0;font-size:13px;color:var(--muted)}
.hlpanel .row{display:flex;gap:6px;flex-wrap:wrap}
.nrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--muted)}
.sync{color:var(--accent);font-weight:500}
.acct{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.acct .btn{padding:5px 10px}
.nrow .btn{padding:4px 9px;font-size:12px}
.pen{display:inline-flex;align-items:center;gap:3px;font:500 10.5px/1 var(--f-mono);color:var(--note-ink);background:var(--note-bg);border:1px solid var(--note-line);padding:3px 6px;border-radius:4px;margin-left:6px;vertical-align:2px}
.nlist{display:grid;gap:10px}
.nitem{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.nitem a{font-weight:600;text-decoration:none}
.nitem small{color:var(--muted);font:12px var(--f-mono)}
.lb{position:fixed;inset:0;background:rgba(8,14,16,.86);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lb img{max-width:100%;max-height:82vh;background:#fff;border-radius:6px}
.lb p{color:#dfe7e9;font-size:13px;margin:10px 0 0;text-align:center}

/* guide */
.rail a[data-g]{justify-content:flex-start;gap:6px}
.rail a .gl{flex:none;min-width:42px}
.gpart{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin:0 0 10px;scroll-margin-top:90px}
.gpart>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.gpart>summary::-webkit-details-marker{display:none}
.gpart>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:auto;align-self:center;transition:transform .15s}
.gpart[open]>summary::after{transform:rotate(225deg)}
.gpart>summary h2{font-size:18px;flex:1 1 260px}
.gpn{font:500 12px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.gbody{padding:0 16px 16px;border-top:1px solid var(--line);max-width:100%;overflow-wrap:anywhere}
.gbody h3{font:600 16px var(--f-head);margin:18px 0 6px}
.gbody p{margin:8px 0}
.gbody ul.gl{list-style:none;margin:6px 0;padding:0}
.gbody ul.gl li{position:relative;padding-left:16px;margin:3px 0}
.gbody ul.gl li::before{content:"";position:absolute;left:3px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--muted)}
.gbody ul.gl li.lv1{margin-left:18px}.gbody ul.gl li.lv1::before{background:none;border:1px solid var(--muted)}
.gbody ul.gl li.lv2{margin-left:36px}.gbody ul.gl li.lv2::before{border-radius:0;width:4px;height:4px}
.gbody ul.gl li.lv3{margin-left:54px}
.gt{margin:10px 0}
.gt table{font-size:13.5px}
.gt th{background:var(--soft);color:var(--ink);font:600 12px var(--f-body);text-transform:none;letter-spacing:0}
.gt td,.gt th{border:1px solid var(--line);min-width:70px}
.gt td.cc,.gt th.cc{background:color-mix(in srgb,var(--cc) 55%,var(--panel))}
.gpg{display:flex;align-items:center;gap:10px;margin:16px 0 6px;color:var(--muted);font:12px var(--f-mono)}
.gpg::before,.gpg::after{content:"";flex:1;height:1px;background:var(--line)}
.gpg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;cursor:pointer;font:12px var(--f-mono);color:var(--muted)}
.gpg button:hover{border-color:var(--accent);color:var(--ink)}
.gfig{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px;margin:6px 6px 6px 0;cursor:zoom-in;max-width:100%;vertical-align:top}
.gfig img{display:block;max-width:100%;height:auto;max-height:340px;width:auto}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.pager a{text-decoration:none;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;max-width:48%}
.pager small{display:block;color:var(--muted);font:12px var(--f-mono)}
.evq{flex:1;min-width:200px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
.evch{margin:22px 0 8px;font-size:18px}
.evitem{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin:0 0 8px}
.evitem>summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none}
.evitem>summary::-webkit-details-marker{display:none}
.evitem .in{padding:0 14px 12px}
.evitem small{color:var(--muted);font:12px var(--f-mono);margin-right:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;font-size:12.5px}
.legend span{padding:3px 8px;border-radius:4px;border:1px solid var(--line);background:color-mix(in srgb,var(--cc) 55%,var(--panel))}
.lb.page{overflow:auto;justify-content:flex-start}
.lb.page img{max-height:none;width:min(100%,980px);height:auto}
.tabs-sm{display:none}
@media (max-width:520px){.gt td,.gt th{min-width:120px}.gbody{padding:0 12px 14px}.tabs-lg{display:none}.tabs-sm{display:inline}.seg button{padding:6px 11px}}

/* drawer for phones */
.scrim{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);padding-top:14px}
  .menu-btn{display:inline-block}
  .rail{position:fixed;top:0;bottom:0;left:0;width:min(84vw,320px);max-height:none;background:var(--panel);z-index:50;padding:calc(env(safe-area-inset-top,0px) + 16px) 14px 30px max(14px,env(safe-area-inset-left,0px));transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .rail.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:45}
  h1{font-size:25px}
  .search{order:5;flex-basis:100%}
  .hcard{grid-template-columns:minmax(0,1fr)}
  .top .wrap{gap:8px;padding-block:8px}
}
@media (max-width:520px){
  .brand span{display:none}
  .hcard .big{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
(function(){
const D = window.CS, IMG = window.CSIMG || {};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem('csp:'+k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem('csp:'+k, JSON.stringify(v)); }catch(e){} }
};
const PHASE_LABEL = {vitals:'Vitals', inspect:'Inspection', palpate:'Palpation', percuss:'Percussion', auscultate:'Auscultation', special:'Special test', rom:'Range of motion', power:'Power'};

/* ---------- reference diagrams per exam ---------- */
const REFS = {

/* ---------- rendering helpers ---------- */
function liClass(t){
  if (t.startsWith('◦')) return ['sub', t.slice(1).trim()];
  if (t.startsWith('▪')) return ['sub2', t.slice(1).trim()];
  if (t.startsWith('•')) return ['', t.slice(1).trim()];
  if (/^\d+\./.test(t)) return ['plain', t];
  if (/:$/.test(t) && t.length < 70) return ['hd', t];
  return ['plain', t];
}
function list(arr){
  if (!arr || !arr.length) return '';
  return '<ul>' + arr.map(t => { const [c,x] = liClass(t); return `<li class="${c}">${esc(x)}</li>`; }).join('') + '</ul>';
}
function para(arr){ return (arr||[]).map(t => `<p>${esc(t.replace(/^•\s*/,''))}</p>`).join(''); }

let cur = null, showExtra = true, histTab = 'hpi';
function stepPhase(s){ return s.phase || ''; }
function examKey(id,i){ return id+':'+i; }

/* ---------- my notes (saved in this browser) ---------- */
const notes = {
  all(){ return store.get('notes') || {}; },
  get(k){ const n = this.all()[k]; return n ? n.text : ''; },
  set(k, text){ const a = this.all(); const old = a[k] ? a[k].text : ''; if (old === text) return; if (text.trim()) a[k] = {text, at: Date.now()}; else delete a[k]; store.set('notes', a); cloud.push(k); },
};

const isHl = k => k.startsWith('hl:');
const noteKeys = () => Object.keys(notes.all()).filter(k => !isHl(k));

/* ---------- rich-text notes: stored as a small, cleaned subset of HTML ---------- */
const looksHtml = t => /<(div|p|br|b|i|u|ul|ol|li|span|strong|em|font)\b/i.test(t);
function cleanHtml(html){
  const tpl = document.createElement('template'); tpl.innerHTML = html;
  const OK = {B:1, STRONG:1, I:1, EM:1, U:1, UL:1, OL:1, LI:1, BR:1, DIV:1, P:1, SPAN:1, FONT:1};
  (function walk(el){
    [...el.childNodes].forEach(n => {
      if (n.nodeType === 3) return;
      if (n.nodeType !== 1 || /^(script|style|iframe|object|embed|template|svg|math|img|video|audio)$/i.test(n.nodeName)) { n.remove(); return; }
      walk(n);
      if (!OK[n.nodeName]) { n.replaceWith(...n.childNodes); return; }
      const keep = {};
      if (n.nodeName === 'FONT' && /^[1-7]$/.test(n.getAttribute('size') || '')) keep.size = n.getAttribute('size');
      if (n.nodeName === 'SPAN') {
        const st = [], cs = n.style;
        if (/bold|[6-9]00/.test(cs.fontWeight)) st.push('font-weight:bold');
        if (cs.fontStyle === 'italic') st.push('font-style:italic');
        if (/underline/.test(cs.textDecorationLine || cs.textDecoration || '')) st.push('text-decoration:underline');
        if (st.length) keep.style = st.join(';');
      }
      [...n.attributes].forEach(a => n.removeAttribute(a.name));
      Object.entries(keep).forEach(([k, v]) => n.setAttribute(k, v));
      if ((n.nodeName === 'FONT' && !keep.size) || (n.nodeName === 'SPAN' && !keep.style)) n.replaceWith(...n.childNodes);
    });

function noteHtml(text){ return looksHtml(text) ? cleanHtml(text) : esc(text).replace(/\n/g, '<br>'); }

// plain-text version for the .md export
function noteText(text){
  if (!looksHtml(text)) return text;
  const tpl = document.createElement('template'); tpl.innerHTML = cleanHtml(text);
  let out = '';
  (function walk(n, depth){
    for (const c of n.childNodes) {
      if (c.nodeType === 3) { out += c.data.replace(/\s+/g, ' '); continue; }
      const t = c.nodeName;
      if (t === 'BR') { out += '\n'; continue; }
      if (t === 'LI') { out += '\n' + '  '.repeat(depth) + '- '; walk(c, depth + 1); continue; }
      const block = /^(DIV|P|UL|OL)$/.test(t);
      if (block && out && !out.endsWith('\n')) out += '\n';
      const w = (t === 'B' || t === 'STRONG') ? '**' : (t === 'I' || t === 'EM') ? '_' : '';
      out += w; walk(c, depth); out += w;
      if (block && !out.endsWith('\n')) out += '\n';
    }
  })(tpl.content, 0);
  return out.replace(/\n{3,}/g, '\n\n').trim();
}

/* ---------- highlighter: ranges are character offsets within a page section, synced like notes under "hl:" keys ---------- */
const HL_NAMES = ['Yellow', 'Green', 'Pink', 'Blue', 'Orange'];
const NOHL = '.gpg,.gfig,.pager,.note,.snote,.tools,.nrow,.pen,.progress,.tag,[data-sync],[data-saved],button,input,textarea,svg,.fmt,.subtabs,.order,[contenteditable]';
const hl = {
  mode: null, // null = off, 0–4 = colour, 'erase'
  color: (() => { const c = store.get('hlc'); return Number.isInteger(c) && c >= 0 && c < HL_NAMES.length ? c : 0; })(),
  get(key){ try { const v = JSON.parse(notes.get(key) || '[]'); return Array.isArray(v) ? v : []; } catch(e){ return []; } },
  put(key, list){ notes.set(key, list.length ? JSON.stringify(list) : ''); },
  // the text nodes that belong to this section (not nested sections, notes, buttons or counters)
  nodes(scope){
    const out = [], w = document.createTreeWalker(scope, NodeFilter.SHOW_TEXT);
    for (let n; (n = w.nextNode());) { const p = n.parentElement; if (p && p.closest('[data-hls]') === scope && !p.closest(NOHL)) out.push(n); }

  paint(scope){

    scope.normalize();
    this.get(scope.dataset.hls).forEach(([s, e, c], idx) => {
      let pos = 0; const segs = [];
      for (const n of this.nodes(scope)) { const L = n.length, a = Math.max(s, pos), b = Math.min(e, pos + L); if (b > a && n.data.trim()) segs.push([n, a - pos, b - pos]); pos += L; if (pos >= e) break; }
      segs.forEach(([n, a, b]) => { if (a > 0) n = n.splitText(a); if (b - a < n.length) n.splitText(b - a);
        const m = document.createElement('mark'); m.className = 'hl'; m.dataset.c = c; m.dataset.r = idx; n.replaceWith(m); m.appendChild(n); });
    });
  },
  paintAll(){ document.querySelectorAll('[data-hls]').forEach(sc => this.paint(sc)); },
  merge(list, s, e, mode){
    const out = [];
    list.forEach(([a, b, c]) => { if (b <= s || a >= e) out.push([a, b, c]); else { if (a < s) out.push([a, s, c]); if (b > e) out.push([e, b, c]); } });

  },
  fromSelection(){
    if (this.mode == null) return;

    const r = sel.getRangeAt(0), main = $('#main');
    if (!main.contains(r.commonAncestorContainer)) return;
    const anc = r.commonAncestorContainer.nodeType === 1 ? r.commonAncestorContainer : r.commonAncestorContainer.parentElement;
    if (anc.closest('[contenteditable],input,textarea')) return;
    let did = false;
    [main, ...main.querySelectorAll('[data-hls]')].filter(sc => sc.dataset.hls && r.intersectsNode(sc)).forEach(sc => {
      let pos = 0, s = -1, e = -1;
      for (const n of this.nodes(sc)) { const L = n.length;
        if (r.intersectsNode(n)) { const a = n === r.startContainer ? r.startOffset : 0, b = n === r.endContainer ? r.endOffset : L; if (b > a && n.data.slice(a, b).trim()) { if (s < 0) s = pos + a; e = pos + b; } }
        pos += L; }
      if (s < 0 || e <= s) return;
      this.put(sc.dataset.hls, this.merge(this.get(sc.dataset.hls), s, e, this.mode)); this.paint(sc); did = true;
    });

  },
  selT: 0, down: false,
  onSelChange(){

  },
  pageKeys(){
    const pre = view === 'guide' ? ['hl:g:' + guideTok.slice(2) + ':'] : cur ? ['hl:x:' + cur, 'hl:s:' + cur + ':'] : ['hl:h:' + histTab];
    return Object.keys(notes.all()).filter(k => pre.some(p => k === p || (p.endsWith(':') && k.startsWith(p))));
  },
  set(mode){
    this.mode = mode;

  },
  panel(open){ $('#hlpanel').hidden = !open; $('#hlbtn').setAttribute('aria-expanded', open); },
  ui(){
    document.body.insertAdjacentHTML('beforeend', `<div class="hlfab" id="hlfab">
      <div class="hlpanel" id="hlpanel" role="dialog" aria-label="Highlighter" hidden>
        <div class="hd">Highlighter <span id="hlstate">Off</span></div>
        <div class="sw">${HL_NAMES.map((n, i) => `<button type="button" class="sw-${i}" data-hlc="${i}" aria-label="${n}" title="${n}"></button>`).join('')}

        <p id="hlhint"></p>
        <div class="row"><button type="button" class="btn" data-hlact="off">Turn off</button><button type="button" class="btn" data-hlact="clear">Clear this page</button></div>
      </div>
      <button type="button" class="hlbtn" id="hlbtn" aria-pressed="false" aria-expanded="false" aria-label="Highlighter" title="Highlighter"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg><span class="dot" hidden></span></button></div>`);
    this.set(null);
  }

/* ---------- account sync (claude.ai only; the local folder version stays on-device) ---------- */
const cloud = {
  col: null, mode: null, state: 'local', timers: {}, busy: {}, again: {}, seen: {}, user: null,
  // merge notes from the account into this device; newest edit wins, blank text = deleted
  apply(remote, first){
    const a = notes.all(); let changed = false;
    for (const [k, v] of Object.entries(remote)) {
      if (!v || typeof v.text !== 'string') continue;
      this.seen[k] = v.at || 0;
      if (!a[k] || (v.at || 0) > a[k].at) { if (v.text.trim()) a[k] = {text: v.text, at: v.at || 0}; else delete a[k]; changed = true; }
    }
    if (changed) { store.set('notes', a); refreshNoteViews(); }
    if (first) Object.keys(notes.all()).forEach(k => { if (!(k in this.seen) || notes.all()[k].at > this.seen[k]) this.push(k, 0); });
    this.state = 'synced'; syncBadge();
  },
  async init(){
    if (window.claude && window.claude.use) return this.initClaude();
    if (location.protocol === 'http:' || location.protocol === 'https:') return this.initServer();
  },
  async initClaude(){
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const uid = user ? await user.id() : null;
      if (!db || !uid) return;
      this.col = db.collection('data/users/' + uid); this.mode = 'claude';
      this.state = 'syncing'; syncBadge();
      let first = true;
      this.col.onSnapshot(snap => {
        const remote = {};
        snap.docs.forEach(d => { const v = d.data() || {}; remote[v.k || d.id] = v; });
        this.apply(remote, first); first = false;
      }, () => { this.state = 'error'; syncBadge(); });
    } catch (e) { this.state = 'local'; syncBadge(); }
  },
  async initServer(){
    try {
      const me = await fetch('/api/me', {credentials: 'same-origin'}).then(r => r.ok ? r.json() : null);
      if (!me || !me.username) return;
      this.mode = 'server'; this.user = me.username; accountBar();
      this.state = 'syncing'; syncBadge();
      await this.pull(true);
      const again = () => { if (document.visibilityState === 'visible') this.pull(false); };
      document.addEventListener('visibilitychange', again);
      window.addEventListener('focus', again);
      setInterval(again, 30000);
    } catch (e) { this.state = 'local'; syncBadge(); }
  },
  async pull(first){
    try {
      const r = await fetch('/api/notes', {credentials: 'same-origin', cache: 'no-store'});
      if (r.status === 401) { location.href = '/login.html'; return; }
      if (!r.ok) throw 0;
      this.apply((await r.json()).notes || {}, first);
    } catch (e) { this.state = 'error'; syncBadge(); }
  },
  docId(k){ return k.replace(/[^A-Za-z0-9_\-.~:@+]/g, '_'); },
  push(k, delay){
    if (!this.mode) return;
    clearTimeout(this.timers[k]);
    this.timers[k] = setTimeout(() => this.write(k), delay == null ? 900 : delay);
  },
  async write(k){
    if (this.busy[k]) { this.again[k] = true; return; }
    this.busy[k] = true; this.state = 'syncing'; syncBadge();
    const n = notes.all()[k];
    // an emptied note is kept as a blank entry so other devices drop it too
    const rec = {k, text: n ? n.text : '', at: n ? n.at : Date.now()};
    try {
      if (this.mode === 'claude') await this.col.doc(this.docId(k)).set(rec);
      else {
        const r = await fetch('/api/notes', {method: 'PUT', credentials: 'same-origin', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(rec)});
        if (r.status === 401) { this.state = 'error'; syncBadge(); this.busy[k] = false; location.href = '/login.html'; return; }
        if (!r.ok) throw {code: r.status >= 500 ? 'unavailable' : 'error'};
      }
      this.seen[k] = rec.at; this.state = 'synced';
    } catch (e) {
      this.state = (e && e.code === 'quota_exceeded') ? 'full' : 'error';
      if (e && e.code === 'unavailable') setTimeout(() => this.push(k, 0), 1500 + Math.random() * 1500);
    }
    this.busy[k] = false; syncBadge();
    if (this.again[k]) { this.again[k] = false; this.write(k); }
  }
};
function accountBar(){
  const w = document.querySelector('.top .wrap');

  document.getElementById('logout').addEventListener('click', async () => {
    const pending = Object.keys(cloud.timers); await Promise.all(pending.map(k => cloud.write(k)));
    await fetch('/api/logout', {method: 'POST', credentials: 'same-origin'}).catch(() => {});
    store.set('notes', {});
    location.href = '/login.html';

}

const EXAM2CH = {approach:'c4', vitals:'c4', resp:'c5', cardiac:'c6', headneck:'c7', pv:'c8', volume:'c9', renal:'c10', lymph:'c11', abdo:'c13', diabetes:'c14', thyroid:'c15', adrenal:'c16', breast:'c21', shoulder:'c23', elbow:'c24', hand:'c25', knee:'c26', hip:'c27', ankle:'c28', back:'c29', gals:'c30', neuro:'c31', mse:'c32', eye:'c40'};
let G = null, gLoading = null, railMode = null, view = 'exam', guideTok = 'g-c1', evFilter = '';
function loadGuide(){
  if (G) return Promise.resolve(G);

    const sc = document.createElement('script'); sc.src = ASSET + 'guide.js';
    sc.onload = () => { G = window.CSG; indexGuide(); if (railMode === 'guide') renderRail('guide', true); if (view === 'notes') renderNotes(); ok(G); };

const gch = id => G ? G.chapters.find(c => c.id === id) : null;

function go(token, stepIdx){
  closeDrawer();

  if (/^g-[a-z0-9]+$/.test(token || '')) { renderGuide(token, stepIdx); store.set('last', token); return; }
  if (HIST[token]) { setTop(true); renderHist(token); window.scrollTo(0,0); store.set('last', token); return; }
  const id = D.exams[token] ? token : 'approach';
  setTop(false); renderExam(id); store.set('last', id);

    const el = document.getElementById(id+'-'+stepIdx);

const INDEX = [];
for (const [id,ex] of Object.entries(D.exams)) ex.steps.forEach((s,i)=>INDEX.push({t:s.name, sub:ex.title+' · '+s.sec, id, i, hay:(s.name+' '+ex.title+' '+s.sec).toLowerCase()}));

function search(q){
  const box = $('#results'); q = q.trim().toLowerCase();
  if (q.length < 2){ box.hidden = true; return; }
  const words = q.split(/\s+/);
  const hits = INDEX.filter(x => words.every(w => x.hay.includes(w))).slice(0,30);
  box.innerHTML = hits.length ? hits.map((x,k)=>`<button data-k="${INDEX.indexOf(x)}">${esc(x.t)}<small>${esc(x.sub)}</small></button>`).join('') : `<button disabled>No match. Try a test name like “Phalen” or “egophony”.</button>`;
  box.hidden = false;
}

document.addEventListener('click', e => {

  if (!t.closest('.search')) $('#results').hidden = true;

  if (ra){ e.preventDefault(); const tok = ra.dataset.id || ra.dataset.h || ra.dataset.g; if (ra.dataset.g === 'g-evidence') evFilter = ''; history.replaceState(null,'','#'+tok); go(tok); return; }

  const pgb = t.closest('[data-page]');
  if (pgb){ const n = +pgb.dataset.page; $('#lb').classList.add('page'); $('#lbImg').src = ASSET + 'pages/p' + String(n).padStart(3, '0') + '.webp'; $('#lbCap').textContent = 'McMaster Clinical Skills Guide, 6e, p. ' + n + ' · tap anywhere to close'; $('#lb').hidden = false; $('#lb').scrollTop = 0; return; }
  const gp = t.closest('[data-gpart]');
  if (gp){ e.preventDefault(); const el = document.getElementById('gp' + gp.dataset.gpart); if (el){ el.open = true; el.scrollIntoView({block:'start'}); } return; }
  if (t.closest('#lb')){ $('#lb').hidden = true; return; }

  const fb = t.closest('.fmt button');
  if (fb){ const ed = document.querySelector(`.rte[data-note="${fb.parentElement.dataset.for}"]`); if (!ed) return;
    if (document.activeElement !== ed) { ed.focus(); const r = lastRange[ed.dataset.note]; if (r && ed.contains(r.startContainer)) { const s = getSelection(); s.removeAllRanges(); s.addRange(r); } else caretEnd(ed); }
    if (fb.dataset.cmd) document.execCommand(fb.dataset.cmd, false, null); else document.execCommand('fontSize', false, fb.dataset.size);
    fmtState(ed); clearTimeout(saveT[ed.dataset.note]); saveT[ed.dataset.note] = setTimeout(()=>saveNote(ed), 300); return; }
  const act = t.closest('[data-act]');
  if (act){
    const a = act.dataset.act;
    if (a==='open') document.querySelectorAll('.step').forEach(d => { if (!d.closest('[hidden]')) { d.open = true; fillStep(d); } });
    if (a==='close') document.querySelectorAll('.step').forEach(d => d.open = false);
    if (a==='gopen') document.querySelectorAll('.gpart').forEach(d => d.open = true);
    if (a==='gclose') document.querySelectorAll('.gpart').forEach(d => d.open = false);
    if (a==='reset'){ store.set('t:'+cur, {}); document.querySelectorAll('.step').forEach(d=>{d.classList.remove('done'); d.querySelector('.tick').checked=false;}); updateProg(); }
    if (a==='exportmd') download('clinical-skills-notes.md', notesMarkdown(), 'text/markdown');
    if (a==='exportjson') download('clinical-skills-notes-backup.json', JSON.stringify(notes.all(), null, 1), 'application/json');
    if (a==='rosreset'){ store.set('ros', {}); document.querySelectorAll('[data-ros]').forEach(c=>c.checked=false); }
  }
});
let saveT = {}, lastRange = {};
function saveNote(ed){
  const k = ed.dataset.note, v = edVal(ed); notes.set(k, v);
  document.querySelectorAll(`[data-saved="${k}"]`).forEach(el => el.textContent = v ? 'Saved ' + fmtTime(Date.now()) : '');
  const det = document.getElementById(k.replace(/^step:/,'').replace(':','-'));
  if (det && k.startsWith('step:')){ const nm = det.querySelector('summary .name'); const pen = nm.querySelector('.pen'); if (v && !pen) nm.insertAdjacentHTML('beforeend','<span class="pen">✎</span>'); if (!v && pen) pen.remove(); }
  updateCount();
}
function caretEnd(ed){ const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
function fmtState(ed){
  const bar = ed.previousElementSibling; if (!bar || !bar.classList.contains('fmt')) return;
  bar.querySelectorAll('[data-cmd]').forEach(b => { let on = false; try { on = document.queryCommandState(b.dataset.cmd); } catch(e){} b.setAttribute('aria-pressed', on); });
}
function updateCount(){ const c = $('#ncount'); if (c) c.textContent = noteKeys().length || ''; }
const edOf = e => e.target && e.target.closest ? e.target.closest('.rte[data-note]') : null;
document.addEventListener('input', e => { const ed = edOf(e); if (ed){ clearTimeout(saveT[ed.dataset.note]); saveT[ed.dataset.note] = setTimeout(()=>saveNote(ed), 300); } });
document.addEventListener('focusout', e => { const ed = edOf(e); if (ed){ clearTimeout(saveT[ed.dataset.note]); saveNote(ed); } });
// keep formatting buttons from stealing focus (and the phone keyboard) from the note
['pointerdown','mousedown'].forEach(ev => document.addEventListener(ev, e => { if (e.target.closest && e.target.closest('.fmt button')) e.preventDefault(); }));
// paste as plain text so web pages don't bring their own fonts and colours
document.addEventListener('paste', e => { const ed = edOf(e); if (!ed) return; e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text/plain')); });
document.addEventListener('keydown', e => { const ed = edOf(e); if (ed && (e.ctrlKey || e.metaKey) && /^[biu]$/i.test(e.key)) setTimeout(() => fmtState(ed), 0); });
document.addEventListener('selectionchange', () => {
  const ed = document.activeElement && document.activeElement.closest ? document.activeElement.closest('.rte[data-note]') : null;
  if (ed) { const s = getSelection(); if (s.rangeCount && ed.contains(s.anchorNode)) lastRange[ed.dataset.note] = s.getRangeAt(0).cloneRange(); fmtState(ed); }
  hl.onSelChange();
});
window.addEventListener('beforeunload', () => document.querySelectorAll('.rte[data-note]').forEach(ed => notes.set(ed.dataset.note, edVal(ed))));
document.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('step') && e.target.open) fillStep(e.target); }, true);
document.addEventListener('change', e => {
  if (e.target.id==='importNotes' && e.target.files[0]){
    const r = new FileReader();
    r.onload = () => { try { const inc = JSON.parse(r.result); const a = notes.all(); let n = 0;
      for (const [k,v] of Object.entries(inc)) { if (v && typeof v.text === 'string' && (!a[k] || (v.at||0) > a[k].at)) { a[k] = {text:v.text, at:v.at||Date.now()}; n++; } }
      store.set('notes', a); renderNotes(); updateCount(); $('.lead').insertAdjacentHTML('afterend', `<div class="intro">Restored ${n} note${n===1?'':'s'} from the backup. Newer notes already on this computer were kept.</div>`);
    } catch(err){ $('.lead').insertAdjacentHTML('afterend', '<div class="intro">That file isn’t a notes backup. Choose the .json file made with “Back up”.</div>'); } };
    r.readAsText(e.target.files[0]);
  }
  if (e.target.id==='xtra'){ showExtra = e.target.checked; document.querySelectorAll('[data-extra="1"]').forEach(el=>el.hidden=!showExtra); }
  if (e.target.dataset && e.target.dataset.ros){ const m = store.get('ros') || {}; m[e.target.dataset.ros] = e.target.checked; store.set('ros', m); }
});
document.addEventListener('keydown', e => { if (e.key==='Escape'){ hl.panel(false); $('#lb').hidden = true; $('#results').hidden = true; closeDrawer(); } });
document.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') hl.down = true; });
document.addEventListener('mouseup', () => { hl.down = false; if (hl.mode != null) setTimeout(() => hl.fromSelection(), 0); });
document.addEventListener('touchend', () => { if (hl.mode != null) { clearTimeout(hl.selT); hl.selT = setTimeout(() => hl.fromSelection(), 900); } });
$('#q').addEventListener('input', e => search(e.target.value));
document.addEventListener('input', e => { if (e.target.id === 'evq') { evFilter = e.target.value; renderEvList(); } });
$('#tabGuide').addEventListener('click', () => { const l = store.get('lastGuide') || 'g-c1'; history.replaceState(null,'','#'+l); go(l); });
$('#q').addEventListener('keydown', e => { if (e.key==='Enter'){ const b = $('#results button[data-k]'); if (b) b.click(); } });
$('#tabExam').addEventListener('click', () => { const l = store.get('lastExam') || 'approach'; history.replaceState(null,'','#'+l); go(l); });
$('#tabHist').addEventListener('click', () => { history.replaceState(null,'','#'+histTab); go(histTab); });
function closeDrawer(){ $('#rail').classList.remove('open'); $('#scrim').classList.remove('open'); }
$('#menuBtn').addEventListener('click', () => { $('#rail').classList.add('open'); $('#scrim').classList.add('open'); });
$('#scrim').addEventListener('click', closeDrawer);
window.addEventListener('hashchange', routeFromHash);
const _go = go; go = function(tok, i){ if (D.exams[tok]) store.set('lastExam', tok); _go(tok, i); };

renderRail('exam');
hl.ui();
updateCount();
cloud.init();
routeFromHash();
// fetch the guide in the background so search covers it
(window.requestIdleCallback || (f => setTimeout(f, 1500)))(() => loadGuide().catch(() => {}));
})();
</script>
