<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Log in · Clinical Skills Pocket</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">
<style>
:root{--bg:#f5f7f7;--panel:#fff;--ink:#14222b;--muted:#5b6b73;--line:#dbe3e5;--accent:#0d6b62;--accent-ink:#fff;--err:#a33b4b;--err-bg:#fbeef0;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-head:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f1719;--panel:#162124;--ink:#e3ecee;--muted:#93a6ab;--line:#2a3a3e;--accent:#4cc2b0;--accent-ink:#06211d;--err:#ec8494;--err-bg:#2e1a1e;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);display:grid;place-items:center;
  padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px}
.brand{display:flex;align-items:center;gap:8px;font:600 18px var(--f-head);margin-bottom:4px}
p.sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.tabs{display:flex;background:var(--bg);border-radius:999px;padding:3px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;padding:7px;border-radius:999px;font:500 14px var(--f-body);color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
label{display:block;font-size:13px;font-weight:500;margin:10px 0 4px}
input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:15px var(--f-body)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.go{width:100%;margin-top:18px;border:0;border-radius:8px;padding:11px;background:var(--accent);color:var(--accent-ink);font:600 15px var(--f-body);cursor:pointer}
.go:disabled{opacity:.6;cursor:wait}
.err{background:var(--err-bg);color:var(--err);border-radius:8px;padding:9px 11px;font-size:14px;margin-top:14px}
.hint{color:var(--muted);font-size:13px;margin:12px 0 0}
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 3v6a4 4 0 0 0 8 0V3"/><path d="M10 13v3a5 5 0 0 0 10 0v-2"/><circle cx="20" cy="12" r="2"/></svg>
    Clinical Skills Pocket
  </div>
  <p class="sub">Log in to see the guide and your session notes on any device.</p>
  <div class="tabs" id="tabs" hidden>
    <button type="button" id="tLogin" aria-pressed="true">Log in</button>
    <button type="button" id="tSignup" aria-pressed="false">Create account</button>
  </div>
  <form id="form" novalidate>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <div id="codeRow" hidden>
      <label for="c">Sign-up code</label>
      <input id="c" name="code" autocomplete="off">
    </div>
    <button class="go" id="go" type="submit">Log in</button>
    <div class="err" id="err" role="alert" hidden></div>
    <p class="hint" id="hint" hidden></p>
  </form>
</main>
<script>
(function(){
  let mode = 'login', info = {signupOpen:false, needsCode:false};
  const $ = id => document.getElementById(id);
  function setMode(m){
    mode = m;
    $('tLogin').setAttribute('aria-pressed', m === 'login');
    $('tSignup').setAttribute('aria-pressed', m === 'signup');
    $('go').textContent = m === 'login' ? 'Log in' : 'Create account';
    $('p').autocomplete = m === 'login' ? 'current-password' : 'new-password';
    $('codeRow').hidden = !(m === 'signup' && info.needsCode);
    $('hint').hidden = m !== 'signup';
    $('hint').textContent = info.needsCode ? 'Ask the site owner for the sign-up code.' : 'This creates the site’s only account. After that, sign-up closes.';
    $('err').hidden = true;
  }
  $('tLogin').onclick = () => setMode('login');
  $('tSignup').onclick = () => setMode('signup');
  fetch('/api/me', {credentials:'same-origin'}).then(r => r.json()).then(j => {
    if (j.error) { $('err').textContent = j.error; $('err').hidden = false; return; }
    if (j.username) { location.replace('/'); return; }
    info = j;
    $('tabs').hidden = !j.signupOpen;
    setMode(j.signupOpen && !j.needsCode ? 'signup' : 'login');
  }).catch(() => {});
  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    $('err').hidden = true; $('go').disabled = true;
    const payload = {username: $('u').value, password: $('p').value, code: $('c').value};
    try {
      const r = await fetch('/api/' + mode, {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
      const j = await r.json().catch(() => ({}));
      if (r.ok) { location.replace('/'); return; }
      $('err').textContent = j.error || 'Something went wrong. Try again.';
    } catch (err) {
      $('err').textContent = 'Couldn’t reach the server. Check your connection and try again.';
    }
    $('err').hidden = false; $('go').disabled = false;
  });
})();
</script>
</body>
</html>
